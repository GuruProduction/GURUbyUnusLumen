# CI for GURU's Rust brain and its Android integration.
#
# WHY THIS EXISTS. There was no pipeline. `.github` held only FUNDING.yml, so nothing
# checked a pull request, and every defect the Cerebrum remediation fixed had shipped
# through that silence:
#
#   * the native library was a hand-copied binary and nothing compiled it, so three merged
#     Rust fixes were absent from the released APK while every test passed;
#   * decay, strength, layer and confidence were computed and never read;
#   * a deleted fact could be resurrected by the ordinary write path;
#   * QUERY and PREFETCH were declared and never dispatched;
#   * the backup carried the transcript and not the memory.
#
# Each of those is now caught by a test. The pipeline's job is to make sure the tests run
# on a machine that has none of a developer's local state: no pre-existing `.so`, no warm
# Gradle cache, no `local.properties`.
#
# WHAT IT DELIBERATELY DOES NOT DO. It does not publish, tag, bump the version or touch a
# release. A pipeline that can ship is a pipeline that can ship by accident.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it replaced; cancelling the stale one keeps the queue
# honest without ever cancelling a run against the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because an unpinned Rust or NDK turns a green build into a coincidence. The
  # toolchain is also pinned in cerebrum/rust-toolchain.toml; this is the installer's copy
  # so the action installs the same version the file asks for.
  RUST_TOOLCHAIN: "1.96.0"
  NDK_VERSION: "27.0.12077973"
  CARGO_TERM_COLOR: always
  # Cargo and Gradle caches both key on the lockfiles, so a dependency change is the only
  # thing that invalidates them.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust brain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: GURUbeta-FULL/cerebrum -> target

      - name: Formatting
        working-directory: GURUbeta-FULL/cerebrum
        # The workspace is formatted; a pull request that is not is refused. This is a gate
        # rather than a suggestion because an unformatted diff hides the real change.
        run: cargo fmt --all -- --check

      - name: Build the whole workspace
        working-directory: GURUbeta-FULL/cerebrum
        run: cargo build --workspace --locked

      - name: Clippy
        working-directory: GURUbeta-FULL/cerebrum
        # Warnings are refused, not tolerated. A warning here has always been a defect
        # waiting for a caller: an unused import hiding a dead branch, a must-use dropped.
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::all

      - name: Tests
        working-directory: GURUbeta-FULL/cerebrum
        run: cargo test --workspace --locked

  android-native:
    name: Android native builds for every ABI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Add the four Android targets
        working-directory: GURUbeta-FULL/cerebrum
        # rust-toolchain.toml already lists these, and this makes the requirement explicit
        # in the log so a missing target is obvious rather than a downstream link error.
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install the pinned NDK
        # THE ACTION IS HERE ONLY TO PUT THE SDK ON PATH, WITH ITS OWN PACKAGE STEP OFF.
        #
        # `android-actions/setup-android` runs `sdkmanager tools` as part of its install, and
        # the runner's cmdline-tools 16.0 no longer publishes a package by that name. It fails
        # with "Failed to find package 'tools'" before any step of this workflow runs, which is
        # how the first ever CI run ended: three jobs dead on an action's own package list, and
        # the Rust job dead on formatting. Neither was a defect in the app.
        #
        # An empty package list leaves the action doing the one thing needed, and the NDK is
        # installed by the exact version this repository pins rather than by the action's guess.
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: GURUbeta-FULL/cerebrum -> target
          key: android-native

      - name: Build every ABI and check the provenance marker in each
        working-directory: GURUbeta-FULL/cerebrum
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          REVISION="$(git rev-parse HEAD)"
          echo "Embedding revision ${REVISION}"

          build_one() {
            local abi="$1" triple="$2" clang="$3"
            echo "::group::${abi} (${triple})"

            # THE VARIABLES ARE NAMED WITH `env`, AND THE FIRST ATTEMPT DID NOT DO THAT.
            #
            # A command prefix like `VAR=x cargo build` sets an environment variable for that
            # one command. `VAR=$(...)  ...` where the NAME is also computed does not: bash
            # parses the word before expanding it, so `CARGO_TARGET_$(...)_LINKER=value` is not
            # an assignment at all, and the whole line is read as "run the command named
            # CARGO_TARGET_..._LINKER" which exits 127 with the assignment text as the error.
            # That is exactly what the second CI run reported.
            #
            # `env` takes the assignment as an argument after word splitting, so a computed
            # name works, and every variable lands in cargo's environment as intended.
            local upper_triple lower_triple
            upper_triple="$(echo "$triple" | tr 'a-z-' 'A-Z_')"
            lower_triple="$(echo "$triple" | tr '-' '_')"

            env \
              "CARGO_TARGET_${upper_triple}_LINKER=${TOOLCHAIN_BIN}/${clang}" \
              "CC_${lower_triple}=${TOOLCHAIN_BIN}/${clang}" \
              "AR_${lower_triple}=${TOOLCHAIN_BIN}/llvm-ar" \
              "CEREBRUM_BUILD_REV=${REVISION}" \
              cargo build --release --locked -p cerebrum-android --target "$triple"

            local so="target/${triple}/release/libcerebrum_android.so"
            test -f "$so" || { echo "::error::no library produced for ${abi}"; exit 1; }

            # THE PROVENANCE ASSERTION, and the reason this job exists. A binary that does
            # not carry this revision is a stale artefact, which is exactly how three merged
            # fixes shipped absent from a release.
            if ! grep -qaF "cerebrum-build-rev=${REVISION}" "$so"; then
              echo "::error::${abi} does not carry the build marker for ${REVISION}; it is a stale artefact"
              exit 1
            fi
            echo "::endgroup::"
          }

          build_one arm64-v8a aarch64-linux-android aarch64-linux-android29-clang
          build_one armeabi-v7a armv7-linux-androideabi armv7a-linux-androideabi29-clang
          build_one x86_64 x86_64-linux-android x86_64-linux-android29-clang
          build_one x86 i686-linux-android i686-linux-android29-clang

  android-app:
    name: Android app, unit tests and APK provenance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust and the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install the pinned NDK
        # THE ACTION IS HERE ONLY TO PUT THE SDK ON PATH, WITH ITS OWN PACKAGE STEP OFF.
        #
        # `android-actions/setup-android` runs `sdkmanager tools` as part of its install, and
        # the runner's cmdline-tools 16.0 no longer publishes a package by that name. It fails
        # with "Failed to find package 'tools'" before any step of this workflow runs, which is
        # how the first ever CI run ended: three jobs dead on an action's own package list, and
        # the Rust job dead on formatting. Neither was a defect in the app.
        #
        # An empty package list leaves the action doing the one thing needed, and the NDK is
        # installed by the exact version this repository pins rather than by the action's guess.
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: GURUbeta-FULL/cerebrum -> target
          key: android-app

      - name: Point the build at the SDK on this runner
        working-directory: GURUbeta-FULL
        # local.properties is gitignored and carries the release keystore on a developer's
        # machine, so CI writes its own with nothing but the SDK path. Release signing stays
        # absent, which is correct: this pipeline must not be able to publish.
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Debug APK, which compiles Rust and Kotlin together
        working-directory: GURUbeta-FULL
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Unit tests
        working-directory: GURUbeta-FULL
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: The snapshot engine, including the stale-vault refusal
        working-directory: GURUbeta-FULL
        # NAMED RATHER THAN LEFT INSIDE THE SUITE. A testDebugUnitTest run reports a total, and
        # a total cannot tell a reviewer whether the two tests that guard a silent data-loss
        # path actually executed. They are in the suite above as well; this invocation makes
        # their names appear in the log, and a missing or renamed class fails here loudly.
        run: |
          ./gradlew :core:database:testDebugUnitTest \
            --tests "com.unuslumen.app.database.snapshot.DatabaseSnapshotEngineTest" \
            --console=plain --no-daemon

      - name: The APK contains the brain built from this revision
        working-directory: GURUbeta-FULL
        # THE END-TO-END ASSERTION. Everything above could be green while the APK shipped a
        # stale library: that is precisely what happened before. This reads the packaged
        # artefact, not the build directory, and compares the marker against the commit.
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::no debug APK was produced"; exit 1; }
          REVISION="$(git rev-parse HEAD)"
          echo "Expecting cerebrum-build-rev=${REVISION}"

          python3 - "$APK" "$REVISION" <<'PY'
          import sys, zipfile
          apk, revision = sys.argv[1], sys.argv[2]
          expected = {"arm64-v8a", "armeabi-v7a", "x86_64", "x86"}

          # THE MARKER IS READ WITH A DELIMITER, NOT A GREEDY CLASS.
          #
          # A Rust string literal has no NUL in .rodata once the linker merges adjacent
          # constants, so an unterminated marker sits directly next to whatever literal
          # follows. A `[A-Za-z0-9._-]+` class then runs past the revision and produces
          # "cerebrum-build-rev=<40 hex>payload" - the first CI failure of this check, where
          # the brain WAS from the right commit and the extra bytes came from the next
          # string in the binary. The marker carries a trailing ';' now, and this reader
          # requires it, so a marker that loses its terminator fails loudly here instead of
          # silently absorbing its neighbour.
          PREFIX = b"cerebrum-build-rev="
          # The class the build script filters a revision through. The DELIMITER is separate
          # and is not part of it, so the run stops before the ';' and the byte after the run
          # is checked to be the terminator.
          REVISION_CHARS = set(b"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_.")
          TERMINATOR = ord(";")

          def markers_in(payload):
              out = set()
              start = 0
              while True:
                  at = payload.find(PREFIX, start)
                  if at < 0:
                      return out
                  index = at + len(PREFIX)
                  run = bytearray()
                  while index < len(payload) and payload[index] in REVISION_CHARS:
                      run.append(payload[index])
                      index += 1
                  # THE TERMINATOR MUST FOLLOW IMMEDIATELY. A run that reaches the end of the
                  # buffer, or is followed by anything but ';', has no delimiter: that is the
                  # shape that produced "cerebrum-build-rev=<40 hex>payload" and failed a run
                  # whose brain was from the correct commit.
                  terminated = index < len(payload) and payload[index] == TERMINATOR
                  text = run.decode("ascii", "replace")
                  out.add(text if terminated else f"{text} [NO TERMINATOR]")
                  start = index + 1 if terminated else index

          with zipfile.ZipFile(apk) as archive:
              found = {}
              for name in archive.namelist():
                  if not name.endswith("/libcerebrum_android.so"):
                      continue
                  abi = name.split("/")[1]
                  found[abi] = sorted(markers_in(archive.read(name)))
              missing = expected - set(found)
              if missing:
                  sys.exit(f"::error::the APK carries no brain for {sorted(missing)}")
              for abi, markers in sorted(found.items()):
                  if not markers:
                      sys.exit(f"::error::{abi} brain carries no provenance marker at all")
                  if any("[NO TERMINATOR]" in m for m in markers):
                      sys.exit(f"::error::{abi} marker is not terminated: {markers}")
                  # `markers` holds the REVISIONS, not the prefixed marker, because the prefix
                  # is what `find` consumed. Comparing a bare revision against a prefixed
                  # expectation is the mistake this line used to make.
                  if revision not in markers:
                      sys.exit(f"::error::{abi} brain is not from {revision}: {markers}")
                  print(f"{abi}: cerebrum-build-rev={revision}")
          PY

      - name: Upload the APK for inspection
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: GURUbeta-FULL/app/build/outputs/apk/debug/app-debug.apk
          # Long enough to download and install, short enough not to hoard artefacts.
          retention-days: 7

  android-device:
    name: The shipped brain, proved on an emulator
    runs-on: ubuntu-24.04
    # The only job that proves the packaged library EXECUTES. Every other check reads
    # files; this one boots a real vault in the app's own uid and drives create, search,
    # update, history, delete, the resurrection refusal, QUERY and PREFETCH through the
    # shipped .so. It is what three merged-but-absent fixes would have failed.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust and the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install the pinned NDK
        # THE ACTION IS HERE ONLY TO PUT THE SDK ON PATH, WITH ITS OWN PACKAGE STEP OFF.
        #
        # `android-actions/setup-android` runs `sdkmanager tools` as part of its install, and
        # the runner's cmdline-tools 16.0 no longer publishes a package by that name. It fails
        # with "Failed to find package 'tools'" before any step of this workflow runs, which is
        # how the first ever CI run ended: three jobs dead on an action's own package list, and
        # the Rust job dead on formatting. Neither was a defect in the app.
        #
        # An empty package list leaves the action doing the one thing needed, and the NDK is
        # installed by the exact version this repository pins rather than by the action's guess.
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: GURUbeta-FULL/cerebrum -> target
          key: android-device

      - name: Point the build at the SDK on this runner
        working-directory: GURUbeta-FULL
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Enable KVM so the emulator is usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the memory test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # x86_64 because the runner is x86_64; the app packages that ABI from source, so
          # the binary under test is the one this build compiled rather than a shipped copy.
          # EACH LINE OF `script` RUNS IN ITS OWN `sh -c`, SO THE DIRECTORY MUST BE IN THE
          # COMMAND ITSELF. The previous version did `cd GURUbeta-FULL` on one line and
          # `./gradlew ...` on the next, which the action executes as two separate shells: the
          # second one started in the repo root, where there is no gradlew, and exited 127 with
          # "./gradlew: not found". That is why the fourth run booted the emulator in 26 seconds
          # and then failed without Gradle ever starting. It also cannot use `pipefail`, because
          # `/usr/bin/sh` here is dash and dash has no such option.
          #
          # BOTH DEVICE CLASSES, AND THE SECOND ONE IS THE ROUND TRIP.
          #
          # The memory test drives create, search, update, history, delete, the resurrection
          # refusal, QUERY and PREFETCH through the shipped .so. The backup test seals a brain
          # with facts, a relationship, a superseded version and a deletion, deletes the vault,
          # restores from the sealed bytes, and boots the restored vault with NO passphrase from
          # the caller so the Keystore envelope is what opens it. Either class failing means the
          # packaged library is not doing what the app claims.
          script: |
            cd GURUbeta-FULL && ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.unuslumen.app.guru.CerebrumMemoryOnDeviceTest,com.unuslumen.app.guru.CerebrumBackupRestoreOnDeviceTest --console=plain --no-daemon
