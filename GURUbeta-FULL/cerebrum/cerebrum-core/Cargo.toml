[package]
name = "cerebrum-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.5"
