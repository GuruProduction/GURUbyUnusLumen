[package]
name = "cerebrum-server"
version = "0.1.0"
edition = "2021"

[dependencies]
cerebrum-core = { path = "../cerebrum-core" }
cerebrum-query = { path = "../cerebrum-query" }
cerebrum-curate = { path = "../cerebrum-curate" }
cerebrum-storage = { path = "../cerebrum-storage" }
cerebrum-decay = { path = "../cerebrum-decay" }
cerebrum-graph = { path = "../cerebrum-graph" }
cerebrum-dream = { path = "../cerebrum-dream" }
cerebrum-prefetch = { path = "../cerebrum-prefetch" }
cerebrum-episodic = { path = "../cerebrum-episodic" }
cerebrum-signatures = { path = "../cerebrum-signatures" }
cerebrum-dwm = { path = "../cerebrum-dwm" }
cerebrum-events = { path = "../cerebrum-events" }
cerebrum-embeddings = { path = "../cerebrum-embeddings" }
cerebrum-policy = { path = "../cerebrum-policy" }
cerebrum-crypto = { path = "../cerebrum-crypto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
