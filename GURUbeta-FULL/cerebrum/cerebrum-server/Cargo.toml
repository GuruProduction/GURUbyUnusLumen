[package]
name = "cerebrum-server"
version = "0.1.0"
edition = "2021"

[dependencies]
cerebrum-core = { path = "../cerebrum-core" }
cerebrum-query = { path = "../cerebrum-query" }
cerebrum-curate = { path = "../cerebrum-curate" }
cerebrum-storage = { path = "../cerebrum-storage" }
cerebrum-decay = { path = "../cerebrum-decay" }
cerebrum-graph = { path = "../cerebrum-graph" }
cerebrum-dream = { path = "../cerebrum-dream" }
cerebrum-prefetch = { path = "../cerebrum-prefetch" }
cerebrum-episodic = { path = "../cerebrum-episodic" }
cerebrum-signatures = { path = "../cerebrum-signatures" }
cerebrum-dwm = { path = "../cerebrum-dwm" }
cerebrum-events = { path = "../cerebrum-events" }
cerebrum-embeddings = { path = "../cerebrum-embeddings" }
cerebrum-policy = { path = "../cerebrum-policy" }
cerebrum-crypto = { path = "../cerebrum-crypto" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

# THE SECCOMP HARDENING NEEDS libc, AND ONLY ON LINUX.
#
# `hardening.rs` calls `libc::prctl`, `libc::syscall` and `libc::sock_filter` inside a
# `#[cfg(target_os = "linux")]` module, and `libc` was never declared at all. That went
# unnoticed for as long as it did because the whole module is Linux-gated, so a macOS
# build never compiles it: the first Linux build in this repo's history (CI) failed with
# "cannot find module or crate `libc`". Declared as a target dependency rather than a plain
# one so a macOS build keeps exactly the dependency set it had before.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
