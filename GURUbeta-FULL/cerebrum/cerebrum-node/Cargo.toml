[package]
name = "cerebrum-node"
version = "0.1.0"
edition = "2021"

[dependencies]
cerebrum-core = { path = "../cerebrum-core" }
cerebrum-server = { path = "../cerebrum-server" }
chrono = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }