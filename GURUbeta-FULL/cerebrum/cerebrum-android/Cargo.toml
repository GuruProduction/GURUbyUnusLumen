[package]
name = "cerebrum-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "cerebrum_android"
crate-type = ["cdylib"]

[dependencies]
cerebrum-core = { path = "../cerebrum-core" }
cerebrum-server = { path = "../cerebrum-server" }
chrono = "0.4"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "signal", "net", "io-util", "time", "fs"] }
zeroize = "1.8"
jni = "0.21"