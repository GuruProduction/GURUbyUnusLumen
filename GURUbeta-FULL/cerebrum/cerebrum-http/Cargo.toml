[package]
name = "cerebrum-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
cerebrum-core = { path = "../cerebrum-core" }
cerebrum-server = { path = "../cerebrum-server" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }