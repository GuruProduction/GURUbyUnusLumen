[package]
name = "cerebrum-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
cerebrum-core = { path = "../cerebrum-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4"] }
rustc-hash = "2.0"

[dev-dependencies]
rand = "0.9"
